name: Publish Millie to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: millie_bank_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:bank-data
      - run: npm run check:workflow
      - run: npm run test:bank-ledger
        env:
          PG_TEST_URL: postgresql://postgres@127.0.0.1:55439/millie_bank_test
      - run: npm run test:context-auto-links
        env:
          PG_TEST_URL: postgresql://postgres@127.0.0.1:55439/millie_bank_test
      - run: npm run test:workflow-sql
        env:
          PG_TEST_URL: postgresql://postgres@127.0.0.1:55439/millie_bank_test
      - run: npm run test:dollar-limits
        env:
          PG_TEST_URL: postgresql://postgres@127.0.0.1:55439/millie_bank_test
      - run: npm run test:model-credits
        env:
          PG_TEST_URL: postgresql://postgres@127.0.0.1:55439/millie_bank_test
      - run: npm run build
      - run: npm run check:hosting
      - name: Publish tested static assets
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
